kind = "web"
previewPath = "/"
title = "Akshay Suresh Portfolio"
description = "A cinematic interactive portfolio for Akshay Suresh, a full-stack developer and computer science student showcasing projects, skills, experience, and contact details."
version = "1.0.0"
id = "artifacts/akshay-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23212

[services.development]
run = "pnpm --filter @workspace/akshay-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/akshay-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/akshay-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23212"
BASE_PATH = "/"
